<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd6e7"/>
      <stop offset="50%" style="stop-color:#fff0ba"/>
      <stop offset="100%" style="stop-color:#c9f0ff"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff85a1"/>
      <stop offset="100%" style="stop-color:#ff6b9d"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- House body -->
  <rect x="156" y="260" width="200" height="160" rx="8" fill="#fff" opacity="0.95"/>
  <!-- Roof -->
  <polygon points="130,270 256,140 382,270" fill="url(#roof)"/>
  <polygon points="130,270 256,140 382,270" fill="#ff6b9d" opacity="0.15"/>
  <!-- Door -->
  <rect x="216" y="330" width="80" height="90" rx="40 40 0 0" fill="#ffd6e7"/>
  <!-- Windows -->
  <rect x="170" y="285" width="55" height="45" rx="8" fill="#c9f0ff" opacity="0.9"/>
  <rect x="287" y="285" width="55" height="45" rx="8" fill="#c9f0ff" opacity="0.9"/>
  <!-- Window cross -->
  <line x1="197" y1="285" x2="197" y2="330" stroke="#fff" stroke-width="3"/>
  <line x1="170" y1="307" x2="225" y2="307" stroke="#fff" stroke-width="3"/>
  <line x1="314" y1="285" x2="314" y2="330" stroke="#fff" stroke-width="3"/>
  <line x1="287" y1="307" x2="342" y2="307" stroke="#fff" stroke-width="3"/>
  <!-- Chimney -->
  <rect x="300" y="155" width="30" height="55" rx="4" fill="#ff85a1"/>
  <!-- Stars/sparkles -->
  <circle cx="100" cy="120" r="8" fill="#ffb3ba" opacity="0.7"/>
  <circle cx="420" cy="100" r="6" fill="#bae1ff" opacity="0.7"/>
  <circle cx="430" cy="380" r="5" fill="#baffc9" opacity="0.7"/>
  <circle cx="80" cy="380" r="7" fill="#ffd6e7" opacity="0.7"/>
  <!-- Sparkle top right -->
  <path d="M400 150 L406 164 L420 170 L406 176 L400 190 L394 176 L380 170 L394 164 Z" fill="#ffb3ba" opacity="0.8"/>
</svg>